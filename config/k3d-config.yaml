apiVersion: k3d.io/v1alpha5
kind: Simple

# Disable default registry endpoint to avoid pulling images from Docker Hub directly (testing cache)
# --k3s-arg "--disable-default-registry-endpoint@all:*"
# options:
#   k3s:
#     extraArgs:
#       - arg: "--disable-default-registry-endpoint"
#         nodeFilters:
#           - all:*

options:
  k3s:
    extraArgs:
      # Enable etcd to avoid read-after-write issues with sqlite (default)
      - arg: "--cluster-init"
        nodeFilters:
          - server:0

# SUSE_Trust_Root from ca-certificates-suse package
volumes:
  - volume: $PWD/config/SUSE_Trust_Root.crt.pem:/etc/ssl/certs/SUSE_Trust_Root.crt.pem
    nodeFilters:
      - all:*

registries:
  create:
    name: k3d-docker.io
    image: registry:3
    proxy:
      remoteURL: https://registry-1.docker.io
      # Authenticate to Docker Hub (increase rate limit to 200 pulls per hour)
      username: "$DOCKERHUB_USERNAME"
      password: "$DOCKERHUB_PASSWORD"
    volumes:
      - /var/cache/registry/docker-io:/var/lib/registry

  config: |
    mirrors:
      # DockerHub cache is created automatically
      "docker.io":
        endpoint:
          - http://k3d-docker.io:5000

      # GHCR cache is used if k3d-ghcr.io registry exists, to create it run:
      # k3d registry create ghcr.io --proxy-remote-url https://ghcr.io -v /var/cache/registry/ghcr-io:/var/lib/registry
      "ghcr.io":
        endpoint:
          - http://k3d-ghcr.io:5000

      "registry.suse.de":
        endpoint:
          - https://registry.suse.de/v2
    configs:
      "registry.suse.de":
        tls:
          # insecure_skip_verify: true (alternative)
          ca_file: /etc/ssl/certs/SUSE_Trust_Root.crt.pem

